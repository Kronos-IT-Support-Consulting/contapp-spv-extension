name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the last release's version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# One release at a time; a second run waits instead of computing the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Only these booleans reach every step; the secrets and the GitHub token are scoped to the steps that use them.
      HAS_CWS: ${{ secrets.CWS_EXTENSION_ID != '' }}
      HAS_AMO: ${{ secrets.AMO_JWT_ISSUER != '' }}
      HAS_EDGE: ${{ secrets.EDGE_PRODUCT_ID != '' }}
    steps:
      - name: Releases are cut from main only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on the main branch."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: A pushed tag must point at a commit on main
        if: github.event_name == 'push'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$GITHUB_REF_NAME is not on $DEFAULT_BRANCH; releases are cut from reviewed commits only."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ -z "$last" ]; then
              echo "::error::No release tag (vX.Y.Z) to bump from; push the first tag by hand."
              exit 1
            fi
            if [ "$(git rev-list -n 1 "$last")" = "$GITHUB_SHA" ]; then
              # A re-run after a partial failure: this commit is already released under $last.
              echo "::warning::$GITHUB_SHA is already released as $last; refreshing that release (bump=$BUMP ignored)."
              version="${last#v}"
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              case "$BUMP" in
                major) version="$((major + 1)).0.0" ;;
                minor) version="$major.$((minor + 1)).0" ;;
                *) version="$major.$minor.$((patch + 1))" ;;
              esac
            fi
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"

      # The tag is the source of truth; the manifest in the repository keeps whatever version it last had.
      - name: Stamp the version into the manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json

      # Nothing in the lockfile needs an install script. Dependency code still runs in lint and the store steps,
      # which is why the GitHub token only reaches the two steps that call gh.
      - run: npm ci --ignore-scripts

      - run: npm test

      - run: ./build.sh

      - run: npm run lint

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zips=("dist/contapp-spv-chrome-$VERSION.zip" "dist/contapp-spv-firefox-$VERSION.zip")
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-run: keep the release and its notes, refresh the assets.
            gh release upload "$TAG" "${zips[@]}" --clobber
          else
            gh release create "$TAG" "${zips[@]}" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

      # The three store steps all run even when one fails (a store that already has this version refuses it on a
      # re-run); the last step turns any failure into a red job.
      - name: Publish to the Chrome Web Store
        id: cws
        if: env.HAS_CWS == 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          # Chrome Web Store API v2 addresses items as publishers/<publisher id>/items/<extension id>.
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        # chrome-webstore-upload-cli is a pinned devDependency, so npm ci already installed it from the lockfile.
        # Without a subcommand it uploads and publishes.
        run: npx --no-install chrome-webstore-upload --source "dist/contapp-spv-chrome-$VERSION.zip"

      - name: Sign for Firefox (unlisted)
        id: amo
        if: env.HAS_AMO == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --no-install web-ext sign --source-dir dist/firefox --channel unlisted --artifacts-dir dist/signed
          gh release upload "$TAG" dist/signed/*.xpi --clobber

      - name: Publish to Edge Add-ons
        id: edge
        if: env.HAS_EDGE == 'true'
        continue-on-error: true
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          api="https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions"
          auth=(-H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID")
          tmp=$(mktemp -d)

          # Starts an operation and prints the operation id from the Location header. Diagnostics go to stderr:
          # stdout is captured by the caller.
          operation() {
            if ! curl -sS --fail-with-body "${auth[@]}" -D "$tmp/headers" -o "$tmp/body" "$@"; then
              { cat "$tmp/body"; echo; echo "::error::Edge request failed"; } >&2
              return 1
            fi
            awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); n = split($2, parts, "/"); print parts[n] }' "$tmp/headers"
          }

          wait_for() {
            failed_polls=0
            for _ in $(seq 1 60); do
              if ! body=$(curl -sS --fail-with-body "${auth[@]}" "$1"); then
                # Edge documents 429 and 500 as transient; give up only when they persist.
                failed_polls=$((failed_polls + 1))
                [ "$failed_polls" -lt 3 ] || { echo "::error::Polling $1 keeps failing"; return 1; }
                sleep 10
                continue
              fi
              status=$(jq -r '.status' <<< "$body")
              case "$status" in
                Succeeded) return 0 ;;
                InProgress) sleep 10 ;;
                *) echo "$body"; echo "::error::Edge operation ended with status '$status'"; return 1 ;;
              esac
            done
            echo "::error::Timed out waiting for $1"
            return 1
          }

          upload=$(operation -H "Content-Type: application/zip" \
            --data-binary @"dist/contapp-spv-chrome-$VERSION.zip" "$api/draft/package")
          [ -n "$upload" ] || { echo "::error::No operation id for the package upload"; exit 1; }
          wait_for "$api/draft/package/operations/$upload"

          publish=$(operation -X POST -H "Content-Type: application/json" -d "{\"notes\":\"Release $TAG\"}" "$api")
          [ -n "$publish" ] || { echo "::error::No operation id for the publish request"; exit 1; }
          wait_for "$api/operations/$publish"

      - name: Every configured store took the release
        if: always()
        env:
          RESULTS: cws=${{ steps.cws.outcome }} amo=${{ steps.amo.outcome }} edge=${{ steps.edge.outcome }}
        run: |
          echo "$RESULTS"
          if [[ "$RESULTS" == *failure* ]]; then
            echo "::error::A store step failed: $RESULTS"
            exit 1
          fi
