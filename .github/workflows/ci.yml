name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Ensure jq
        run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)

      - run: npm ci --ignore-scripts

      - name: Syntax check
        run: node --check background.js && node --check content.js

      - run: npm test

      - run: ./build.sh

      - name: Release manifests carry only production hosts
        run: |
          for target in chrome firefox; do
            jq -e '[.content_scripts[].matches[] | select(test("\\.test/"))] | length == 0' "dist/$target/manifest.json"
          done

      - run: npm run lint

      # Loads dist/chrome into Chromium; every request is answered by test routes, nothing reaches ANAF.
      - name: Browser tests
        run: npx playwright install --with-deps chromium && npm run test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contapp-spv-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
