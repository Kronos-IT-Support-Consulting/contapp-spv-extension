name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Ensure jq
        run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)

      - run: npm ci

      - name: Syntax check
        run: node --check background.js && node --check content.js

      - run: npm test

      - run: ./build.sh

      - name: Release manifests carry only production hosts
        run: |
          for target in chrome firefox; do
            jq -e '[.content_scripts[].matches[] | select(test("\\.test/"))] | length == 0' "dist/$target/manifest.json"
          done

      - run: npm run lint

      - uses: actions/upload-artifact@v7
        with:
          name: contapp-spv-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
